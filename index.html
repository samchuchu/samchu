<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam Chu | Loading...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease;
    }
    
    .loader-text {
      font-family: 'Outfit', system-ui, sans-serif;
      color: #f5f5f5;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="loader" id="loader">
    <span class="loader-text">Loading</span>
  </div>
  
  <video id="intro-video" autoplay muted playsinline>
    <source src="https://raw.githubusercontent.com/samchuchu/samchu-old/main/title-vid/Final2.mp4" type="video/mp4">
  </video>
  
  <script>
    const video = document.getElementById('intro-video');
    const videoSource = video.querySelector('source');
    const loader = document.getElementById('loader');
    
    // Device detection - check if mobile/tablet
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
      || window.innerWidth <= 768;
    
    // Set appropriate video source
    if (isMobile) {
      videoSource.src = 'https://raw.githubusercontent.com/samchuchu/samchu-old/main/title-vid/portrait_sound.mp4';
      video.load();
    }
    
    // Hide loader when video can play
    video.addEventListener('canplay', function() {
      loader.style.opacity = '0';
      setTimeout(function() {
        loader.style.display = 'none';
      }, 500);
    });
    
    // Also hide loader after short timeout as fallback
    setTimeout(function() {
      loader.style.opacity = '0';
      setTimeout(function() {
        loader.style.display = 'none';
      }, 500);
    }, 1000);
    
    // Video ended - redirect to resume
    video.addEventListener('ended', function() {
      window.location.href = 'resume.html';
    });
    
    // Fallback redirect after video duration (approximate)
    // Desktop video ~12s, Mobile ~15s - using 15s as safe fallback
    setTimeout(function() {
      window.location.href = 'resume.html';
    }, 15000);
    
    // Handle video errors
    video.addEventListener('error', function(e) {
      console.log('Video error:', e);
      // Redirect anyway after short delay
      setTimeout(function() {
        window.location.href = 'resume.html';
      }, 3000);
    });
  </script>
</body>
</html>
