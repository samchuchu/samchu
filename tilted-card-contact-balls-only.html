<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tilted Contact Cards Balls Only</title>
  <style>
    :root {
      --bg: #000;
      --ink: #f4f4f5;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.14);
      --glass: rgba(255, 255, 255, 0.055);
      --accent: #8fc8ff;
      --copper: #d2a17c;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --box-width: 742px;
      --box-height: 596px;
      --box-opacity: 0.35;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      overflow: visible;
      background: transparent;
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23noise)' opacity='0.55'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .prototype {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100vw - 44px));
      min-height: 100dvh;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .ballpit-box {
      position: relative;
      width: min(var(--box-width), calc(100vw - 380px));
      height: min(var(--box-height), calc(100dvh - 60px));
      margin-left: 360px;
      overflow: hidden;
      border: 0;
      border-radius: 34px;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      --glare-x: 18%;
      --glare-y: 16%;
    }

    .ballpit-box::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: none;
      opacity: 0;
    }

    #ballpitCanvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .cards-view,
    .window-view {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transition:
        opacity 780ms var(--ease),
        transform 900ms var(--ease),
        filter 900ms var(--ease);
    }

    .cards-view {
      z-index: 2;
      pointer-events: auto;
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .window-view {
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, 26px, 0) scale(0.97);
      filter: blur(16px);
    }

    .prototype.is-open .cards-view {
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, -12px, 0) scale(0.97);
      filter: blur(18px);
    }

    .prototype.is-open .window-view {
      z-index: 3;
      pointer-events: auto;
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      filter: blur(0);
    }

    .card-row {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 210px);
      gap: 28px;
      align-items: center;
      justify-content: center;
      align-content: center;
      margin-top: -53px;
      padding: 22px;
    }

    .contact-card {
      --mx: 18%;
      --my: 12%;
      --rx: 0deg;
      --ry: 0deg;
      --image-height: 183.67px;
      width: 210px;
      height: calc(var(--image-height) * 1.5);
      border: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      perspective: 900px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition:
        opacity 520ms var(--ease),
        transform 680ms var(--ease),
        filter 680ms var(--ease);
    }

    .tilted-card-figure {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 800px;
      display: block;
      margin: 0;
    }

    .tilted-card-inner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid #e0e7ff;
      border-radius: 18px;
      background: #000;
      box-shadow:
        0 28px 70px -40px rgba(0, 0, 0, 0.92),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transform:
        rotateX(var(--rx))
        rotateY(var(--ry))
        translate3d(0, 0, 0);
      transform-style: preserve-3d;
      transition:
        transform 420ms var(--ease),
        border-color 300ms var(--ease);
      will-change: transform;
    }

    .contact-card:hover .tilted-card-inner,
    .contact-card:focus-visible .tilted-card-inner {
      border-color: rgba(143, 200, 255, 0.78);
      transform:
        rotateX(var(--rx))
        rotateY(var(--ry))
        translate3d(0, -8px, 0);
    }

    .contact-card:focus-visible {
      outline: none;
    }

    .tilted-card-img {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }

    .tilted-card-video {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }

    .tilted-card-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at var(--mx) var(--my), rgba(255, 255, 255, 0.16), transparent 27%),
        linear-gradient(135deg, transparent 22%, rgba(255, 255, 255, 0.1) 45%, transparent 62%),
        linear-gradient(to top, rgba(0, 0, 0, 0.54), transparent 46%);
      transform: translateZ(34px);
    }

    .card-label {
      position: absolute;
      inset: auto 12px 12px;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      transform: translateZ(56px);
    }

    .card-label strong {
      font-size: 32px;
      line-height: 0.92;
      letter-spacing: -0.05em;
      text-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
    }

    .card-label span {
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 999px;
      padding: 5px 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .prototype.is-open .cards-view .contact-card {
      opacity: 0;
      transform: translate3d(0, -18px, 0) scale(0.94);
      filter: blur(16px);
    }

    .prototype.is-open .cards-view .contact-card:nth-child(2) {
      transition-delay: 50ms;
    }

    .prototype.is-open .cards-view .contact-card:nth-child(3) {
      transition-delay: 100ms;
    }

    .contact-window {
      position: relative;
      width: 765px;
      height: 478px;
      margin-top: -31px;
      margin-left: 287px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 30px;
      border: 1px solid var(--line);
      border-radius: 40px;
      background: var(--glass);
      box-shadow:
        0 36px 110px -62px rgba(0, 0, 0, 0.94),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(12px);
      overflow: hidden;
      padding: 7px 29px 20px;
      transition:
        width 520ms var(--ease),
        grid-template-columns 520ms var(--ease);
    }

    .contact-window::before {
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      background:
        radial-gradient(circle at 22% 24%, rgba(255, 255, 255, 0.08), transparent 20rem),
        linear-gradient(135deg, rgba(255, 255, 255, 0.075), transparent 40%);
      opacity: 0.75;
    }

    .panel {
      position: relative;
      z-index: 1;
      display: none;
      min-width: 0;
    }

    .email-panel,
    .whatsapp-panel {
      width: 530px;
      height: 492px;
      margin-top: -25px;
    }

    .email-panel {
      padding-left: 0;
      padding-right: 0;
    }

    .email-panel .message-form {
      margin-top: -40px;
    }

    .contact-window[data-mode="email"] .email-panel,
    .contact-window[data-mode="whatsapp"] .whatsapp-panel,
    .contact-window[data-mode="linkedin"] .linkedin-panel {
      display: block;
    }

    .panel-kicker {
      display: none;
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .panel-title {
      margin: 31px 0 26px 524px;
      color: var(--ink);
      font-family: system-ui, sans-serif;
      font-size: 70px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .message-form {
      width: 510px;
      display: grid;
      grid-template-columns: 180px 280px;
      gap: 18px 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field.is-wide {
      grid-column: 1 / -1;
    }

    .email-panel .field.is-wide:nth-of-type(4) {
      height: 202px;
      margin-top: -10px;
      padding-top: 5px;
    }

    .field label {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.42);
      color: var(--ink);
      outline: none;
      padding: 0 13px;
      font-size: 12px;
      font-weight: 300;
      transition:
        border-color 260ms var(--ease),
        background-color 260ms var(--ease);
    }

    .field input {
      height: 30px;
    }

    .field textarea {
      height: 170px;
      min-height: 170px;
      padding-top: 15px;
      resize: none;
    }

    .whatsapp-panel .wa-message-field {
      height: 251px;
      margin-top: -5px;
    }

    .whatsapp-panel #wa-message {
      height: 233px;
      min-height: 233px;
      margin-top: -2px;
      padding-top: 12px;
      font-size: 12px;
      border-width: 2px;
    }

    .whatsapp-panel .message-form {
      margin-top: -39px;
      margin-left: 6px;
      padding-left: 17px;
    }

    .whatsapp-panel .panel-title {
      margin-left: 438px;
      font-size: 56px;
    }

    .whatsapp-panel .field:nth-of-type(1) label,
    .whatsapp-panel .wa-message-field label {
      font-size: 13px;
    }

    .whatsapp-panel #wa-name {
      font-size: 12px;
      border-width: 2px;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(143, 200, 255, 0.72);
      background: rgba(0, 0, 0, 0.58);
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: -2px;
    }

    .form-actions button {
      height: 30px;
      width: 118px;
      min-width: 118px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition:
        transform 260ms var(--ease),
        background-color 260ms var(--ease);
    }

    .form-actions button:hover {
      transform: scale(1.04);
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.09);
    }

    .send-btn {
      background: #7b90b2;
      color: #fff;
      font-size: 18px;
      margin-top: -15px;
    }

    .email-panel .send-btn,
    .whatsapp-panel .send-btn {
      min-width: 79.6px;
      width: fit-content;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: #ffffff;
      color: #323234;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 18px;
      font-weight: 300;
      height: 26px;
      padding: 0;
      opacity: 1;
      margin-top: 0;
    }

    .email-panel .send-btn img,
    .whatsapp-panel .send-btn img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      border-radius: 4px;
      flex: 0 0 auto;
    }

    .email-panel .back-inline-btn,
    .whatsapp-panel .back-inline-btn {
      min-width: 79.6px;
      width: fit-content;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: #ffffff;
      color: #323234;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 18px;
      font-weight: 300;
      height: 26px;
      padding: 0;
      opacity: 1;
      margin-top: 0;
    }

    .email-panel .back-inline-btn img,
    .whatsapp-panel .back-inline-btn img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      border-radius: 4px;
      flex: 0 0 auto;
    }

    .embed-frame {
      width: 612px;
      height: 449px;
      margin-top: 6px;
      margin-left: -15px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 25px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.06), transparent),
        rgba(0, 0, 0, 0.42);
      padding: 11px 15px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
    }

    .linkedin-embed-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
    }

    .linkedin-preview-slot {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.04), transparent),
        rgba(8, 10, 14, 0.82);
    }

    .linkedin-preview-image {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .linkedin-preview-slot.has-preview .linkedin-preview-image {
      display: block;
    }

    .linkedin-preview-fallback {
      height: 100%;
      padding: 24px 20px;
      display: grid;
      align-content: start;
      gap: 12px;
      color: rgba(244, 244, 245, 0.82);
      line-height: 1.55;
    }

    .linkedin-preview-slot.has-preview .linkedin-preview-fallback {
      display: none;
    }

    .linkedin-preview-fallback strong {
      color: var(--ink);
      font-size: 18px;
    }

    .linkedin-preview-fallback code {
      color: #a6cff7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }


    .linkedin-shot {
      height: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #f4f2ee;
      color: #1f2328;
      font-family: system-ui, sans-serif;
    }

    .linkedin-shot-scroll {
      height: 820px;
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .linkedin-browser {
      display: grid;
      gap: 10px;
      padding: 14px 14px 16px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 16px 34px -26px rgba(15, 23, 42, 0.35);
    }

    .linkedin-browser-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .linkedin-browser-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cbd5e1;
    }

    .linkedin-browser-url {
      flex: 1;
      min-width: 0;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eef3f8;
      color: #526a6e;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .linkedin-cover {
      height: 150px;
      border-radius: 16px;
      background:
        radial-gradient(circle at 16% 22%, rgba(255, 255, 255, 0.52), transparent 20%),
        radial-gradient(circle at 80% 18%, rgba(255, 255, 255, 0.42), transparent 18%),
        linear-gradient(135deg, #0a66c2, #71a7df 56%, #dfeaf6);
      position: relative;
      overflow: hidden;
    }

    .linkedin-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(transparent 0 72%, rgba(9, 32, 58, 0.2) 100%),
        repeating-linear-gradient(90deg, transparent 0 58px, rgba(255, 255, 255, 0.16) 58px 60px);
      opacity: 0.7;
    }

    .linkedin-hero {
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      gap: 16px;
      align-items: end;
      margin-top: -52px;
      padding: 0 10px;
    }

    .linkedin-avatar {
      width: 116px;
      height: 116px;
      border-radius: 22px;
      border: 5px solid #ffffff;
      background: #dbeafe;
      object-fit: cover;
      object-position: center top;
      box-shadow: 0 16px 30px -22px rgba(15, 23, 42, 0.42);
    }

    .linkedin-meta {
      padding-bottom: 10px;
      min-width: 0;
    }

    .linkedin-meta h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #111827;
    }

    .linkedin-meta p {
      margin: 6px 0 0;
      color: #45556c;
      font-size: 13px;
      line-height: 1.45;
    }

    .linkedin-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 10px;
    }

    .linkedin-chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef3f8;
      color: #3d5469;
      font-size: 11px;
      font-weight: 600;
    }

    .linkedin-block {
      padding: 14px 16px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 16px 34px -26px rgba(15, 23, 42, 0.35);
      display: grid;
      gap: 10px;
    }

    .linkedin-block h3 {
      margin: 0;
      font-size: 14px;
      color: #111827;
    }

    .linkedin-summary {
      color: #475569;
      font-size: 12px;
      line-height: 1.55;
    }

    .linkedin-highlight-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .linkedin-highlight-card {
      border-radius: 14px;
      border: 1px solid #dbe4ee;
      background: linear-gradient(180deg, #f8fbff, #eef4fb);
      padding: 10px 12px;
      display: grid;
      gap: 6px;
      min-height: 86px;
    }

    .linkedin-highlight-kicker {
      color: #0a66c2;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .linkedin-highlight-card strong {
      color: #1f2937;
      font-size: 13px;
      line-height: 1.35;
    }

    .linkedin-highlight-card span {
      color: #64748b;
      font-size: 11px;
      line-height: 1.45;
    }

    .linkedin-post {
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      background: #fbfdff;
      padding: 12px 14px;
      display: grid;
      gap: 10px;
    }

    .linkedin-post-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .linkedin-post-avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      object-fit: cover;
      object-position: center top;
    }

    .linkedin-post-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .linkedin-post-title strong {
      color: #111827;
      font-size: 12px;
    }

    .linkedin-post-title span {
      color: #64748b;
      font-size: 10px;
    }

    .linkedin-post p {
      margin: 0;
      color: #475569;
      font-size: 11px;
      line-height: 1.55;
    }

    .linkedin-post-media {
      height: 142px;
      border-radius: 14px;
      background:
        radial-gradient(circle at 20% 24%, rgba(255, 255, 255, 0.48), transparent 18%),
        linear-gradient(135deg, #dcebf9, #b6d4f3 58%, #f4f8fc);
      position: relative;
      overflow: hidden;
    }

    .linkedin-post-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(transparent 0 62%, rgba(10, 102, 194, 0.14) 100%),
        repeating-linear-gradient(0deg, transparent 0 24px, rgba(10, 102, 194, 0.08) 24px 26px);
    }

    .linkedin-link-row {
      display: flex;
      justify-content: space-between;
      color: #64748b;
      font-size: 10px;
      font-weight: 600;
    }

    .linkedin-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 20;
      display: flex;
      justify-content: flex-start;
      gap: 14px;
      margin-top: 0;
    }

    .linkedin-actions .back-inline-btn {
      min-width: 92px;
      width: fit-content;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: #1f2937;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 15px;
      font-weight: 500;
      height: 34px;
      padding: 0 14px;
      opacity: 1;

<body>

  <script>
    const prototype = document.querySelector("#prototype");
    const cards = document.querySelectorAll(".cards-view .contact-card");
    const closeButtons = document.querySelectorAll("[data-close]");
    const contactWindow = document.querySelector("#contactWindow");
    const dockImg = document.querySelector("#dockImg");
    const dockVideo = document.querySelector("#dockVideo");
    const dockTitle = document.querySelector("#dockTitle");
    const dockAction = document.querySelector("#dockAction");
    const dockCard = document.querySelector(".dock-card");
    const dockLinkBtn = document.querySelector("#dockLinkBtn");
    const linkedinPreviewSlot = document.querySelector("#linkedinPreviewSlot");
    const linkedinPreviewImage = document.querySelector("#linkedinPreviewImage");
    const ballpitBox = document.querySelector("#ballpitBox");
    const ballpitCanvas = document.querySelector("#ballpitCanvas");
    const ballpitCtx = ballpitCanvas.getContext("2d");
    const maxTilt = 13;
    const ballpitConfig = {
      count: 63,
      size: 26,
      opacity: 0.07,
      speed: 1.7,
      gravity: 0.04,
      cursorForce: 1.15
    };
    const ballpitPalette = ["#E1E9EC", "#CAD6DC", "#A7BBC7", "#849CA8", "#5B7482"];
    const pointer = { x: 0, y: 0, active: false };
    let ballpitDpr = 1;
    let ballpitWidth = 0;
    let ballpitHeight = 0;
    let balls = [];

    function resizeBallpit() {
      const rect = ballpitBox.getBoundingClientRect();
      ballpitDpr = Math.min(window.devicePixelRatio || 1, 2);
      ballpitWidth = rect.width;
      ballpitHeight = rect.height;
      ballpitCanvas.width = Math.max(1, Math.floor(ballpitWidth * ballpitDpr));
      ballpitCanvas.height = Math.max(1, Math.floor(ballpitHeight * ballpitDpr));
      ballpitCanvas.style.width = `${ballpitWidth}px`;
      ballpitCanvas.style.height = `${ballpitHeight}px`;
      ballpitCtx.setTransform(ballpitDpr, 0, 0, ballpitDpr, 0, 0);
    }

    function makeBall() {
      const radius = ballpitConfig.size * (0.58 + Math.random() * 0.9);
      return {
        x: radius + Math.random() * Math.max(1, ballpitWidth - radius * 2),
        y: radius + Math.random() * Math.max(1, ballpitHeight - radius * 2),
        vx: (Math.random() - 0.5) * ballpitConfig.speed * 3,
        vy: (Math.random() - 0.5) * ballpitConfig.speed * 3,
        r: radius,
        mass: radius * radius,
        color: ballpitPalette[Math.floor(Math.random() * ballpitPalette.length)]
      };
    }

    function resetBalls() {
      resizeBallpit();
      balls = Array.from({ length: ballpitConfig.count }, makeBall);
    }

    function updateBall(ball) {
      ball.vy += ballpitConfig.gravity;

      if (pointer.active && ballpitConfig.cursorForce > 0) {
        const dx = ball.x - pointer.x;
        const dy = ball.y - pointer.y;
        const dist = Math.max(24, Math.hypot(dx, dy));
        const reach = 150;
        if (dist < reach) {
          const push = (1 - dist / reach) * ballpitConfig.cursorForce * 1.7;
          ball.vx += (dx / dist) * push;
          ball.vy += (dy / dist) * push;
        }
      }

      ball.vx *= 0.992;
      ball.vy *= 0.992;
      ball.x += ball.vx * ballpitConfig.speed;
      ball.y += ball.vy * ballpitConfig.speed;

      const bounce = 0.82;
      if (ball.x < ball.r) {
        ball.x = ball.r;
        ball.vx = Math.abs(ball.vx) * bounce;
      } else if (ball.x > ballpitWidth - ball.r) {
        ball.x = ballpitWidth - ball.r;
        ball.vx = -Math.abs(ball.vx) * bounce;
      }

      if (ball.y < ball.r) {
        ball.y = ball.r;
        ball.vy = Math.abs(ball.vy) * bounce;
      } else if (ball.y > ballpitHeight - ball.r) {
        ball.y = ballpitHeight - ball.r;
        ball.vy = -Math.abs(ball.vy) * bounce;
        ball.vx *= 0.985;
      }
    }

    function resolveBallCollisions() {
      for (let i = 0; i < balls.length; i += 1) {
        for (let j = i + 1; j < balls.length; j += 1) {
          const a = balls[i];
          const b = balls[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let dist = Math.hypot(dx, dy);
          const minDist = a.r + b.r;

          if (dist === 0) {
            dx = (Math.random() - 0.5) * 0.01;
            dy = (Math.random() - 0.5) * 0.01;
            dist = Math.hypot(dx, dy);
          }

          if (dist >= minDist) continue;

          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = minDist - dist;
          const totalMass = a.mass + b.mass;
          const separationA = overlap * (b.mass / totalMass);
          const separationB = overlap * (a.mass / totalMass);

          a.x -= nx * separationA;
          a.y -= ny * separationA;
          b.x += nx * separationB;
          b.y += ny * separationB;

          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const velocityAlongNormal = rvx * nx + rvy * ny;

          if (velocityAlongNormal > 0) continue;

          const restitution = 0.9;
          const impulse = -(1 + restitution) * velocityAlongNormal / ((1 / a.mass) + (1 / b.mass));
          const impulseX = impulse * nx;
          const impulseY = impulse * ny;

          a.vx -= impulseX / a.mass;
          a.vy -= impulseY / a.mass;
          b.vx += impulseX / b.mass;
          b.vy += impulseY / b.mass;
        }
      }
    }

    function drawShadow(ball) {
      ballpitCtx.save();
      ballpitCtx.beginPath();
      ballpitCtx.ellipse(
        ball.x + ball.r * 0.12,
        ball.y + ball.r * 0.82,
        ball.r * 0.82,
        ball.r * 0.34,
        0,
        0,
        Math.PI * 2
      );
      const shadow = ballpitCtx.createRadialGradient(
        ball.x,
        ball.y + ball.r * 0.78,
        ball.r * 0.1,
        ball.x,
        ball.y + ball.r * 0.82,
        ball.r
      );
      shadow.addColorStop(0, `rgba(5, 8, 14, ${ballpitConfig.opacity * 0.22})`);
      shadow.addColorStop(1, "rgba(5, 8, 14, 0)");
      ballpitCtx.fillStyle = shadow;
      ballpitCtx.fill();
      ballpitCtx.restore();
    }

    function drawBall(ball) {
      const alpha = ballpitConfig.opacity;
      ballpitCtx.save();
      ballpitCtx.shadowBlur = ball.r * 0.9;
      ballpitCtx.shadowColor = `rgba(184, 220, 255, ${Math.min(0.28, alpha * 0.42)})`;
      const gradient = ballpitCtx.createRadialGradient(
        ball.x - ball.r * 0.35,
        ball.y - ball.r * 0.45,
        ball.r * 0.1,
        ball.x,
        ball.y,
        ball.r
      );
      gradient.addColorStop(0, `rgba(255, 255, 255, ${Math.min(1, alpha + 0.18)})`);
      gradient.addColorStop(0.34, `${ball.color}${Math.round(alpha * 255).toString(16).padStart(2, "0")}`);
      gradient.addColorStop(0.82, `rgba(118, 162, 214, ${alpha * 0.68})`);
      gradient.addColorStop(1, `rgba(36, 52, 76, ${alpha * 0.78})`);
      ballpitCtx.beginPath();
      ballpitCtx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ballpitCtx.fillStyle = gradient;
      ballpitCtx.fill();
      ballpitCtx.lineWidth = Math.max(1.1, ball.r * 0.08);
      ballpitCtx.strokeStyle = `rgba(255, 255, 255, ${Math.min(0.78, alpha * 0.58)})`;
      ballpitCtx.stroke();

      const gloss = ballpitCtx.createRadialGradient(
        ball.x - ball.r * 0.26,
        ball.y - ball.r * 0.38,
        ball.r * 0.04,
        ball.x - ball.r * 0.18,
        ball.y - ball.r * 0.28,
        ball.r * 0.56
      );
      gloss.addColorStop(0, `rgba(255, 255, 255, ${Math.min(0.95, alpha * 0.92)})`);
      gloss.addColorStop(0.42, `rgba(255, 255, 255, ${alpha * 0.24})`);
      gloss.addColorStop(1, "rgba(255, 255, 255, 0)");
      ballpitCtx.beginPath();
      ballpitCtx.arc(ball.x - ball.r * 0.14, ball.y - ball.r * 0.18, ball.r * 0.46, 0, Math.PI * 2);
      ballpitCtx.fillStyle = gloss;
      ballpitCtx.fill();

      ballpitCtx.beginPath();
      ballpitCtx.ellipse(
        ball.x - ball.r * 0.18,
        ball.y - ball.r * 0.34,
        ball.r * 0.16,
        ball.r * 0.08,
        -0.4,
        0,
        Math.PI * 2
      );
      ballpitCtx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.98, alpha)})`;
      ballpitCtx.fill();
      ballpitCtx.restore();
    }

    function drawBallpit() {
      ballpitCtx.clearRect(0, 0, ballpitWidth, ballpitHeight);
      balls.forEach((ball) => updateBall(ball));
      resolveBallCollisions();
      resolveBallCollisions();
      const renderOrder = [...balls].sort((a, b) => a.y - b.y);
      renderOrder.forEach(drawShadow);
      renderOrder.forEach(drawBall);
      requestAnimationFrame(drawBallpit);
    }

    const contactConfig = {
      emailTo: "samchuchu.sg@gmail.com",
      whatsappNumber: "6585150437",
      linkedinUrl: "https://linkedin.com/in/samchuchu"
    };

    dockLinkBtn.href = contactConfig.linkedinUrl;

    function syncLinkedinPreviewState() {
      if (!linkedinPreviewSlot || !linkedinPreviewImage) return;
      const hasPreview = linkedinPreviewImage.complete && linkedinPreviewImage.naturalWidth > 0;
      linkedinPreviewSlot.classList.toggle("has-preview", hasPreview);
    }

    if (linkedinPreviewImage) {
      linkedinPreviewImage.addEventListener("load", syncLinkedinPreviewState);
      linkedinPreviewImage.addEventListener("error", syncLinkedinPreviewState);
      syncLinkedinPreviewState();
    }

    let selectedChannel = "email";

    function resetTilt(card) {
      card.style.setProperty("--rx", "0deg");
      card.style.setProperty("--ry", "0deg");
      card.style.setProperty("--mx", "18%");
      card.style.setProperty("--my", "12%");
    }

    function setSelected(card) {
      selectedChannel = card.dataset.card;
      contactWindow.dataset.mode = selectedChannel;
      dockImg.src = card.dataset.img;
      dockImg.alt = `${card.dataset.title} contact artwork`;
      if (card.dataset.video) {
        dockVideo.src = card.dataset.video;
        dockVideo.style.display = "block";
        dockImg.style.display = "none";
        dockVideo.play().catch(() => {});
      } else {
        dockVideo.pause();
        dockVideo.removeAttribute("src");
        dockVideo.load();
        dockVideo.style.display = "none";
        dockImg.style.display = "block";
      }
      dockTitle.textContent = card.dataset.title;
      dockAction.textContent = card.dataset.action;
    }

    function bindTilt(card) {
      card.addEventListener("pointermove", (event) => {
        if (window.matchMedia("(max-width: 640px)").matches) return;
        const rect = card.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const px = x / rect.width;
        const py = y / rect.height;
        const rotateY = (px - 0.5) * maxTilt * 2;
        const rotateX = (0.5 - py) * maxTilt * 2;

        card.style.setProperty("--rx", `${rotateX.toFixed(2)}deg`);
        card.style.setProperty("--ry", `${rotateY.toFixed(2)}deg`);
        card.style.setProperty("--mx", `${(px * 100).toFixed(2)}%`);
        card.style.setProperty("--my", `${(py * 100).toFixed(2)}%`);
      });

      card.addEventListener("pointerleave", () => resetTilt(card));
    }

    ballpitBox.addEventListener("pointermove", (event) => {
      const rect = ballpitBox.getBoundingClientRect();
      pointer.x = event.clientX - rect.left;
      pointer.y = event.clientY - rect.top;
      pointer.active = true;
      ballpitBox.style.setProperty("--glare-x", `${(pointer.x / rect.width) * 100}%`);
      ballpitBox.style.setProperty("--glare-y", `${(pointer.y / rect.height) * 100}%`);
    });

    ballpitBox.addEventListener("pointerleave", () => {
      pointer.active = false;
      ballpitBox.style.setProperty("--glare-x", "18%");
      ballpitBox.style.setProperty("--glare-y", "16%");
    });

    function openWindow(card) {
      cards.forEach(resetTilt);
      resetTilt(dockCard);
      setSelected(card);
      prototype.classList.add("is-open");
    }

    function closeWindow() {
      prototype.classList.remove("is-open");
      cards.forEach(resetTilt);
      resetTilt(dockCard);
    }

    function closeParentContactSession() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "contact-session-close" }, "*");
      }
    }

    function getEmailPayload(form) {
      const data = new FormData(form);
      const name = String(data.get("name") || "").trim();
      const email = String(data.get("email") || "").trim();
      const subject = String(data.get("subject") || "Portfolio contact").trim();
      const message = String(data.get("message") || "").trim();
      const body = [
        name ? `Name: ${name}` : "",
        email ? `Email: ${email}` : "",
        "",
        message
      ].filter(Boolean).join("\n");

      return { subject, body };
    }

    function getWhatsAppText(form) {
      const data = new FormData(form);
      const name = String(data.get("name") || "").trim();
      const message = String(data.get("message") || "").trim();

      return [
        name ? `Name: ${name}` : "",
        message
      ].filter(Boolean).join("\n\n").trim();
    }

    function openWebEmailCompose(payload) {
      const composeUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(contactConfig.emailTo)}&su=${encodeURIComponent(payload.subject)}&body=${encodeURIComponent(payload.body)}`;
      window.open(composeUrl, "_blank", "noopener");
    }

    document.querySelectorAll(".message-form").forEach((form) => {
      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (form.dataset.channel === "email") {
          const payload = getEmailPayload(form);
          openWebEmailCompose(payload);
          return;
        }

        const text = getWhatsAppText(form);
        window.open(`https://wa.me/${contactConfig.whatsappNumber}?text=${encodeURIComponent(text)}`, "_blank", "noopener");
      });
    });

    cards.forEach((card) => {
      bindTilt(card);
      card.addEventListener("click", (event) => {
        event.stopPropagation();
        openWindow(card);
      });
    });

    bindTilt(dockCard);

    closeButtons.forEach((button) => {
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        closeWindow();
      });
    });

    prototype.addEventListener("click", (event) => {
      if (!prototype.classList.contains("is-open")) {
        closeParentContactSession();
        return;
      }
      if (event.target.closest(".contact-window")) return;
      closeWindow();
    });

    resizeBallpit();
    resetBalls();
    requestAnimationFrame(drawBallpit);
    window.addEventListener("resize", resetBalls);
  </script>
</body>
</html>
